<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kiroween Invitation: haunted Halloween invitations</title>
  <meta name="description" content="Generate a haunted, glowing SVG Halloween invitation. Deterministic, client-only, shareable by link." />
  <meta property="og:title" content="Kiroween Invitation: haunted Halloween invitations" />
  <meta property="og:description" content="Make a haunted Halloween invitation and share it by link." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://kiroween-invitation.chogilsang.net/" />
  <meta property="og:image" content="https://kiroween-invitation.chogilsang.net/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="A white ghost in a Dracula costume above a glowing pumpkin: YOU ARE SUMMONED, Kiroween 2026." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://kiroween-invitation.chogilsang.net/og.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <noscript>
    <div class="noscript">
      <h1>Kiroween Invitation</h1>
      <p>A haunted Halloween invitation generator for Kiroween 2026. It renders
         an SVG invitation in your browser — no data is sent to any server.
         Please enable JavaScript to summon your invitation.</p>
    </div>
  </noscript>

  <section class="recv" id="recv" hidden aria-labelledby="recvTitle">
    <h1 class="recv-title" id="recvTitle" tabindex="-1">You are summoned</h1>
    <p class="recv-count" id="recvCount" role="status" aria-live="polite"></p>
    <div id="recvArt" class="art recv-art" role="img" aria-label="Halloween invitation"></div>
    <div class="recv-actions">
      <button type="button" id="recvCal" hidden>Add to calendar</button>
      <button type="button" id="recvShare" hidden>Share…</button>
      <button type="button" id="recvCopy">Copy link</button>
      <button type="button" id="recvSound" aria-pressed="false">Music: off</button>
      <a id="recvOwn" class="btnlink" href="./">Make your own</a>
      <button type="button" id="recvEdit" class="ghost">Edit this invitation</button>
    </div>
    <p class="hint recv-hint" id="recvHint" role="status" aria-live="polite"></p>
  </section>

  <main class="layout" id="app" hidden>
    <section class="controls" aria-label="Invitation controls">
      <h1 class="brand">Kiroween&nbsp;Invitation <span class="sub">Halloween invitations</span></h1>

      <p class="intro">Pick a look, add your name, then save the picture or copy a link. Everything happens in your browser. The picture is a vector illustration (SVG).</p>
      <div class="actions top">
        <button type="button" id="remix" class="remix">Remix the look</button>
        <button type="button" id="savePng">Save as image</button>
        <button type="button" id="saveGif">Save as GIF</button>
        <button type="button" id="copyLink">Copy share link</button>
        <button type="button" id="saveIcs" disabled>Add to calendar (.ics)</button>
        <button type="button" id="shareNative" hidden>Share…</button>
        <button type="button" id="saveCfg" title="Remembers this setup in this browser only">Remember on this device</button>
      </div>
      <p class="hint" id="hint" role="status" aria-live="polite"></p>
      <p class="ics-note" id="icsNote" aria-live="polite"></p>

      <fieldset class="presets">
        <legend>Start from a look</legend>
        <div class="preset-grid" id="presets"><!-- built from the engine's PRESETS (see main.js) --></div>
      </fieldset>

      <label>Purpose
        <div class="seg" role="radiogroup" id="purpose">
          <button type="button" role="radio" data-val="join">Join</button>
          <button type="button" role="radio" data-val="notice">Notice</button>
          <button type="button" role="radio" data-val="recruit">Recruit</button>
        </div>
      </label>

      <label>Year
        <input type="number" id="year" min="2000" max="2100" step="1" value="2026" />
      </label>

      <label>Nickname <span class="note">(max 24 characters, letters and digits)</span>
        <input type="text" id="nick" maxlength="24" placeholder="your handle" aria-describedby="hint" />
      </label>

      <label>Mood
        <select id="mood">
          <option value="screaming">screaming</option>
          <option value="uneasy">uneasy</option>
          <option value="hollow">hollow</option>
        </select>
      </label>

      <label>Palette
        <select id="palette">
          <option value="magenta">magenta</option>
          <option value="deeppurple">deep purple</option>
          <option value="indigo">indigo</option>
        </select>
      </label>

      <label>Glow
        <select id="glow">
          <option value="strong">strong</option>
          <option value="soft">soft</option>
        </select>
      </label>

      <label>Costume
        <div class="pair">
          <select id="costume">
            <option value="none">none</option>
            <option value="dracula">dracula</option>
            <option value="mummy">mummy</option>
            <option value="pirate">pirate</option>
            <option value="skeleton">skeleton</option>
          </select>
          <select id="costumeTint" aria-label="costume color"><option value="">default</option></select>
        </div>
      </label>

      <label>Scene
        <select id="scene">
          <option value="sky">night sky</option>
          <option value="graveyard">graveyard</option>
          <option value="house">haunted house</option>
          <option value="forest">forest</option>
        </select>
      </label>

      <fieldset class="event">
        <legend>Event details (optional)</legend>
        <label>Date <input type="text" id="evDate" maxlength="16" placeholder="Oct 31" /></label>
        <label>Time <input type="text" id="evTime" maxlength="12" placeholder="7:00 PM" /></label>
        <label>Place <input type="text" id="evPlace" maxlength="32" placeholder="Where?" /></label>
      </fieldset>

      <fieldset class="parts" id="assets">
        <legend>Assets and colors</legend>
        <!-- rows are generated from the engine's asset list and swatches (see main.js) -->
      </fieldset>

      <label>Export size
        <select id="format">
          <option value="square">square 1080x1080</option>
          <option value="story">story 1080x1920 (9:16)</option>
          <option value="wide">wide 1920x1080 (16:9)</option>
        </select>
      </label>

    </section>

    <section class="preview" aria-label="Invitation preview">
      <div id="art" class="art" role="img" aria-label="Halloween invitation"></div>
      <div class="sound" role="group" aria-label="Music">
        <button type="button" id="soundToggle" aria-pressed="false">Music: off</button>
        <select id="trackSel" aria-label="Music track">
          <option value="spooky-waltz">Spooky waltz</option>
          <option value="cute-tune">Cute tune</option>
          <option value="creepy-ambient">Creepy ambient</option>
        </select>
      </div>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
