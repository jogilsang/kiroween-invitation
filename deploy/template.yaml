AWSTemplateFormatVersion: "2010-09-09"
Description: >
  ASCII Invite (Kiroween 2026) static site. Private S3 bucket served only
  through CloudFront with Origin Access Control. No public bucket access.

Parameters:
  ProjectTag:
    Type: String
    Default: kiroween
  DeleteAfterTag:
    Type: String
    Default: "2026-12-31"
  DomainName:
    Type: String
    Default: ""
    Description: Optional custom domain, for example kiroween-invitation.example.com. Empty means CloudFront default domain only.
  HostedZoneId:
    Type: String
    Default: ""
    Description: Route 53 hosted zone id that owns DomainName. Required when DomainName is set.

Conditions:
  HasDomain: !Not [!Equals [!Ref DomainName, ""]]

Resources:
  # Public TLS certificate for the custom domain. Must live in us-east-1 for CloudFront;
  # this stack is deployed there. DNS validation records are created in the hosted zone.
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Condition: HasDomain
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
      Tags:
        - Key: project
          Value: !Ref ProjectTag
        - Key: delete-after
          Value: !Ref DeleteAfterTag

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: project
          Value: !Ref ProjectTag
        - Key: delete-after
          Value: !Ref DeleteAfterTag

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ASCII Invite (Kiroween 2026)
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref "AWS::NoValue"]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref Certificate
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - !Ref "AWS::NoValue"
        Origins:
          - Id: s3origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          # AWS managed CachingOptimized policy id
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - Key: project
          Value: !Ref ProjectTag
        - Key: delete-after
          Value: !Ref DeleteAfterTag

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution.Id}"

  # Alias records to the distribution (Z2FDTNDATAQYW2 is CloudFront's fixed hosted zone id).
  DnsRecordA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2
  DnsRecordAAAA:
    Type: AWS::Route53::RecordSet
    Condition: HasDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  SiteURL:
    Value: !If
      - HasDomain
      - !Sub "https://${DomainName}"
      - !Sub "https://${Distribution.DomainName}"
  CloudFrontDomain:
    Value: !Sub "https://${Distribution.DomainName}"
